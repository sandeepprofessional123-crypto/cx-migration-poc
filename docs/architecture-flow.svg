<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#e8eef8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8aa0c2" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#355c9a"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #183153; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #5e7395; }
      .box-title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #183153; }
      .box-text { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #3f5678; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #355c9a; }
      .small { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #526987; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="800" y="70" text-anchor="middle" class="title">CX Migration Engine POC</text>
  <text x="800" y="105" text-anchor="middle" class="subtitle">Multi-SSO onboarding and identity orchestration flow</text>

  <rect x="90" y="250" rx="24" ry="24" width="250" height="130" fill="#ffffff" stroke="#cfd9ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="305" text-anchor="middle" class="box-title">User</text>
  <text x="215" y="338" text-anchor="middle" class="box-text">Browser-based</text>
  <text x="215" y="365" text-anchor="middle" class="box-text">login journey</text>

  <rect x="440" y="200" rx="28" ry="28" width="340" height="230" fill="#ffffff" stroke="#bfd0ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="248" text-anchor="middle" class="box-title">Frontend</text>
  <text x="610" y="278" text-anchor="middle" class="small">React app on Cloud Run</text>
  <text x="490" y="325" class="box-text">• Login page</text>
  <text x="490" y="360" class="box-text">• Provider callbacks</text>
  <text x="490" y="395" class="box-text">• Signup page</text>

  <rect x="950" y="125" rx="28" ry="28" width="300" height="380" fill="#ffffff" stroke="#bfd0ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="175" text-anchor="middle" class="box-title">Identity Providers</text>
  <text x="1000" y="235" class="box-text">• Azure AD</text>
  <text x="1000" y="285" class="box-text">• Google</text>
  <text x="1000" y="335" class="box-text">• Okta OIDC</text>
  <text x="1000" y="385" class="box-text">• SAML via Okta</text>
  <text x="1100" y="455" text-anchor="middle" class="small">External authentication happens here</text>

  <rect x="460" y="560" rx="28" ry="28" width="310" height="210" fill="#ffffff" stroke="#bfd0ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="610" text-anchor="middle" class="box-title">Backend API</text>
  <text x="615" y="640" text-anchor="middle" class="small">FastAPI on Cloud Run</text>
  <text x="505" y="690" class="box-text">• `/user/{email}`</text>
  <text x="505" y="725" class="box-text">• `/signup`</text>
  <text x="505" y="760" class="box-text">• `/user/link-login`</text>

  <rect x="985" y="585" rx="28" ry="28" width="260" height="165" fill="#ffffff" stroke="#bfd0ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115" y="635" text-anchor="middle" class="box-title">Firestore</text>
  <text x="1115" y="668" text-anchor="middle" class="box-text">users/{email}</text>
  <text x="1115" y="705" text-anchor="middle" class="small">profile + loginTypes[]</text>

  <line x1="340" y1="315" x2="440" y2="315" stroke="#355c9a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="388" y="295" text-anchor="middle" class="label">Open app</text>

  <line x1="780" y1="255" x2="950" y2="255" stroke="#355c9a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="865" y="230" text-anchor="middle" class="label">1. Choose provider</text>

  <line x1="950" y1="405" x2="780" y2="405" stroke="#355c9a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="865" y="440" text-anchor="middle" class="label">2. Redirect back with identity</text>

  <line x1="610" y1="430" x2="610" y2="560" stroke="#355c9a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="642" y="505" class="label">3. Check user / register</text>

  <line x1="770" y1="665" x2="985" y2="665" stroke="#355c9a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="875" y="640" text-anchor="middle" class="label">Read / write user</text>

  <path d="M 1115 585 C 1115 515, 840 515, 750 515" fill="none" stroke="#355c9a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1035" y="520" text-anchor="middle" class="label">User exists?</text>

  <rect x="1315" y="245" rx="22" ry="22" width="190" height="110" fill="#ffffff" stroke="#cfd9ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="1410" y="292" text-anchor="middle" class="box-title">Dashboard</text>
  <text x="1410" y="325" text-anchor="middle" class="small">Existing user</text>

  <rect x="1315" y="430" rx="22" ry="22" width="190" height="135" fill="#ffffff" stroke="#cfd9ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="1410" y="480" text-anchor="middle" class="box-title">Signup</text>
  <text x="1410" y="513" text-anchor="middle" class="small">New user onboarding</text>
  <text x="1410" y="540" text-anchor="middle" class="small">email + loginType</text>

  <line x1="1250" y1="305" x2="1315" y2="305" stroke="#355c9a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1285" y="282" text-anchor="middle" class="label">Existing</text>

  <line x1="1250" y1="495" x2="1315" y2="495" stroke="#355c9a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1285" y="470" text-anchor="middle" class="label">New</text>

  <path d="M 1410 565 C 1410 650, 1320 760, 770 760" fill="none" stroke="#355c9a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1220" y="805" text-anchor="middle" class="label">4. Submit signup details</text>

  <path d="M 770 610 C 930 610, 1270 610, 1410 355" fill="none" stroke="#6c87b1" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="1140" y="585" text-anchor="middle" class="small">If login type already linked, go straight to dashboard</text>

  <text x="800" y="860" text-anchor="middle" class="subtitle">
    Key idea: multiple SSO providers, one user record, one onboarding flow
  </text>
</svg>
